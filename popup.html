<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; padding: 12px; font-family: sans-serif; }
    input, select, button { box-sizing: border-box; margin: 4px 0; padding: 8px; width: 100%; }
    #status { white-space: pre-wrap; }
  </style>
</head>
<body>
  <input id="videoUrl" type="url" placeholder="YouTube video URL">
  <select id="downloadType">
    <option value="mp4">MP4 video</option>
    <option value="mp3">MP3 audio</option>
  </select>
  <button id="download">Download with current cookies</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
